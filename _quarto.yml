project:
  type: website
  output-dir: docs/
  execute-dir: project   # run every page with cwd = project root so getwd()/data + data/reference resolve from pages/
  render:
    - index.qmd
    - 404.qmd
    - pages/Aurora3L.qmd
    - pages/Aurora5L.qmd
    - pages/AuroraEVO.qmd
    - pages/Aurora3L_8Peak.qmd
    - pages/Aurora5L_8Peak.qmd
    - pages/AuroraEVO_8Peak.qmd
    - pages/CytekQCBead.qmd
    - pages/help.qmd
website:
  announcement:
    icon: info-circle
    dismissable: true
    content: "Please see left-sidebar for definitions"
    type: info
    position: below-navbar
  title: "Instrument QC"
  site-path: "/InstrumentQC/"
  navbar:
    logo: images/SydneyCytometry.jpg
    left:
    - text: "Home"
      href: index.qmd
    - text: "Levey-Jennings Plots"
      menu:
      - text: "Cytek Aurora 3L"
        href: pages/Aurora3L.qmd
      - text: "Cytek Aurora 5L"
        href: pages/Aurora5L.qmd
      - text: "Cytek Aurora EVO"
        href: pages/AuroraEVO.qmd
    - text: "8 Peak Beads"
      menu:
      - text: "Cytek Aurora 3L"
        href: pages/Aurora3L_8Peak.qmd
      - text: "Cytek Aurora 5L"
        href: pages/Aurora5L_8Peak.qmd
      - text: "Cytek Aurora EVO"
        href: pages/AuroraEVO_8Peak.qmd
    right:
    - text: "QC Bead Lots"
      href: pages/CytekQCBead.qmd
    - text: "Help"
      href: pages/help.qmd
  page-footer:
    background: light
    left: University of Sydney, Australia

format:
  html:
    theme: styles.scss
